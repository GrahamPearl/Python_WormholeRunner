<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060816">
<title>Wormhole Runner</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Wormhole Runner game area"></canvas>
  <div id="screen" class="overlay"><div class="panel"><h1>WORMHOLE RUNNER</h1><p id="load-text">Loading...</p></div></div>
  <div id="topbar">
    <button data-top="pause" aria-label="Pause">❚❚</button>
    <button data-top="mute" aria-label="Mute or unmute sound" aria-pressed="false">🔊</button>
    <button data-top="full" aria-label="Fullscreen">⛶</button>
    <button data-top="settings" aria-label="Settings">⚙</button>
  </div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
